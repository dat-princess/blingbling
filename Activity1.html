<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form with Event Handling</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter / Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                            950: '#500724',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 207, 232, 0.7);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-pink-100 to-pink-200 min-h-screen font-sans text-gray-800 antialiased flex flex-col justify-between">

    <main class="w-full max-w-xl mx-auto px-4 py-4 flex-grow flex flex-col justify-center">
        <!-- Main Card -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl shadow-pink-200/50 relative overflow-hidden">
            <!-- Background Decorative Accent -->
            <div class="absolute -top-12 -right-12 w-36 h-36 bg-pink-300/40 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-pink-100 rounded-2xl mb-3 text-pink-600">
                    <i class="fa-solid fa-paper-plane text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-pink-950">FORM</h2>
                <p class="text-sm text-pink-700/80 mt-1">Please fill in all the details below.</p>
            </div>

            <!-- Interactive Form with the 5 specific placeholders -->
            <form id="contactForm" class="space-y-4" onsubmit="event.preventDefault();">
                <!-- 1. Name Field -->
                <div>
                    <label for="userName" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1">
                        <i class="fa-solid fa-user text-pink-400 mr-1"></i> Name
                    </label>
                    <input 
                        type="text" 
                        id="userName" 
                        placeholder="Enter your full name"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- 2. Address Field -->
                <div>
                    <label for="userAddress" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1">
                        <i class="fa-solid fa-location-dot text-pink-400 mr-1"></i> Address
                    </label>
                    <input 
                        type="text" 
                        id="userAddress" 
                        placeholder="Enter your address"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- 3. Contact # Field -->
                <div>
                    <label for="userContact" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1">
                        <i class="fa-solid fa-phone text-pink-400 mr-1"></i> Contact #
                    </label>
                    <input 
                        type="tel" 
                        id="userContact" 
                        placeholder="Enter your contact number"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- 4. Email Field -->
                <div>
                    <label for="userEmail" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1">
                        <i class="fa-solid fa-envelope text-pink-400 mr-1"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="userEmail" 
                        placeholder="Enter your email address"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- 5. Message Field -->
                <div>
                    <label for="userMessage" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1">
                        <i class="fa-solid fa-comment-dots text-pink-400 mr-1"></i> Message
                    </label>
                    <textarea 
                        id="userMessage" 
                        rows="3" 
                        placeholder="Enter your message"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm resize-none"
                        required
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button 
                    type="button" 
                    id="submitBtn"
                    class="w-full mt-3 py-3.5 px-6 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold rounded-xl shadow-lg shadow-pink-500/25 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 cursor-pointer"
                >
                    <span>Submit Details</span>
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>

            <div id="resultCard" class="hidden mt-6 p-5 rounded-2xl bg-gradient-to-br from-pink-50 to-pink-100 border border-pink-200 animate-fade-in shadow-inner">
                <div class="flex items-center space-x-2 border-b border-pink-200 pb-3 mb-3">
                    <div class="w-8 h-8 rounded-full bg-pink-500 text-white flex items-center justify-center flex-shrink-0 text-sm shadow-sm">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div>
                        <h3 class="text-xs uppercase font-bold tracking-wider text-pink-800">Submission Received</h3>
                        <p class="text-[11px] text-pink-600">Form submitted successfully!</p>
                    </div>
                </div>

                <div class="space-y-2 text-sm text-pink-950">
                    <p><strong class="text-pink-700 font-semibold">Name:</strong> <span id="outName"></span></p>
                    <p><strong class="text-pink-700 font-semibold">Address:</strong> <span id="outAddress"></span></p>
                    <p><strong class="text-pink-700 font-semibold">Contact #:</strong> <span id="outContact"></span></p>
                    <p><strong class="text-pink-700 font-semibold">Email:</strong> <span id="outEmail"></span></p>
                    <p class="pt-1 border-t border-pink-200/60"><strong class="text-pink-700 font-semibold">Message:</strong></p>
                    <p id="outMessage" class="text-xs bg-white/70 p-3 rounded-lg border border-pink-200/60 italic text-gray-700 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submitBtn');
            const nameInput = document.getElementById('userName');
            const addressInput = document.getElementById('userAddress');
            const contactInput = document.getElementById('userContact');
            const emailInput = document.getElementById('userEmail');
            const messageInput = document.getElementById('userMessage');

            const resultCard = document.getElementById('resultCard');
            const outName = document.getElementById('outName');
            const outAddress = document.getElementById('outAddress');
            const outContact = document.getElementById('outContact');
            const outEmail = document.getElementById('outEmail');
            const outMessage = document.getElementById('outMessage');

            const fields = [
                { input: nameInput, id: 'Name' },
                { input: addressInput, id: 'Address' },
                { input: contactInput, id: 'Contact #' },
                { input: emailInput, id: 'Email' },
                { input: messageInput, id: 'Message' }
            ];

            // Form Submit Logic
            submitBtn.addEventListener('click', () => {
                let isValid = true;

                // Simple validation loop
                fields.forEach(field => {
                    if (!field.input.value.trim()) {
                        isValid = false;
                        field.input.classList.add('ring-2', 'ring-red-400', 'border-red-300');
                        setTimeout(() => {
                            field.input.classList.remove('ring-2', 'ring-red-400', 'border-red-300');
                        }, 2000);
                    }
                });

                if (!isValid) return;

                // Output submitted values
                outName.textContent = nameInput.value.trim();
                outAddress.textContent = addressInput.value.trim();
                outContact.textContent = contactInput.value.trim();
                outEmail.textContent = emailInput.value.trim();
                outMessage.textContent = messageInput.value.trim();

                // Display result card with animation
                resultCard.classList.remove('hidden');
                resultCard.classList.remove('animate-fade-in');
                void resultCard.offsetWidth; // Trigger reflow
                resultCard.classList.add('animate-fade-in');
            });
        });
    </script>
</body>
</html>
