<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 1: JavaScript Fundamentals Challenge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 207, 232, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-pink-100 to-pink-200 min-h-screen font-sans text-gray-800 antialiased flex flex-col justify-between">

    <header class="w-full max-w-4xl mx-auto p-4 sm:p-6">
                
            </div>
        
        </div>
    </header>

    <main class="w-full max-w-md mx-auto px-4 py-4 flex-grow flex flex-col justify-center">
        <!-- Main Form Card -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl shadow-pink-100/60 relative overflow-hidden">
            <!-- Decorative Accent Circle -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-pink-300/30 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-pink-100 rounded-2xl mb-3 text-pink-600">
                    <i class="fa-solid fa-sparkles text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-pink-950">Personal Greeting</h2>
                <p class="text-sm text-pink-700/80 mt-1">Enter your details to generate a customized greeting message.</p>
            </div>

            <!-- Form -->
            <form id="greetingForm" class="space-y-4" onsubmit="event.preventDefault();">
                <!-- Name Field -->
                <div>
                    <label for="userName" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-user text-pink-400 mr-1"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        id="userName" 
                        placeholder="e.g., Jane Doe"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/80 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- Age Field -->
                <div>
                    <label for="userAge" class="block text-xs font-bold text-pink-900 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-cake-candles text-pink-400 mr-1"></i> Age
                    </label>
                    <input 
                        type="number" 
                        id="userAge" 
                        placeholder="e.g., 21" 
                        min="1" 
                        max="120"
                        class="w-full px-4 py-3 rounded-xl border border-pink-200 bg-white/80 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition-all text-gray-800 placeholder-pink-300 shadow-sm text-sm"
                        required
                    />
                </div>

                <!-- Submit Button -->
                <button 
                    type="button" 
                    id="generateBtn"
                    class="w-full mt-2 py-3.5 px-6 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold rounded-xl shadow-lg shadow-pink-500/25 active:scale-[0.99] transition-all flex items-center justify-center space-x-2 cursor-pointer"
                >
                    <span>Generate Greeting</span>
                    <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                </button>
            </form>

            <!-- Dynamic Result Container -->
            <div id="resultCard" class="hidden mt-6 p-5 rounded-2xl bg-gradient-to-br from-pink-50 to-pink-100/70 border border-pink-200 animate-fade-in shadow-inner">
                <div class="flex items-start space-x-3">
                    <div id="statusIcon" class="w-10 h-10 rounded-full bg-pink-500 text-white flex items-center justify-center flex-shrink-0 text-base shadow-sm mt-0.5">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between">
                            <h3 id="resultTitle" class="text-xs uppercase font-bold tracking-wider text-pink-700">Greeting Result</h3>
                            <span id="categoryBadge" class="text-[10px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded-full bg-pink-200 text-pink-800">
                                Adult
                            </span>
                        </div>
                        <p id="greetingText" class="text-sm font-medium text-pink-950 mt-1 leading-relaxed"
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * Function to generate a personalized greeting based on name and age.
         * Uses an if-else statement to check minor vs adult status.
         * 
         * @param {string} name - User's name
         * @param {number} age - User's age
         * @returns {object} Object containing greeting message and category status
         */
        function generateGreeting(name, age) {
            // Trim whitespace from name input
            const formattedName = name.trim();
            let isAdult = false;
            let message = "";

            // Condition logic (If-Else statement as required by Activity 1)
            if (age >= 18) {
                isAdult = true;
                message = `Hello, ${formattedName}! Welcome. As an adult (${age} years old), you have full access to all features and content.`;
            } else {
                isAdult = false;
                message = `Hi, ${formattedName}! Welcome! Since you are currently a minor (${age} years old), please make sure you browse with appropriate guidance.`;
            }

            return {
                name: formattedName,
                age: age,
                isAdult: isAdult,
                message: message
            };
        }

        // Attach event listener once DOM content is loaded
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const nameInput = document.getElementById('userName');
            const ageInput = document.getElementById('userAge');
            const resultCard = document.getElementById('resultCard');
            const greetingText = document.getElementById('greetingText');
            const categoryBadge = document.getElementById('categoryBadge');
            const statusIcon = document.getElementById('statusIcon');

            // Handle button click event
            generateBtn.addEventListener('click', () => {
                const name = nameInput.value;
                const age = parseInt(ageInput.value, 10);

                // Validation check
                if (!name.trim()) {
                    nameInput.focus();
                    nameInput.classList.add('ring-2', 'ring-red-400');
                    setTimeout(() => nameInput.classList.remove('ring-2', 'ring-red-400'), 2000);
                    return;
                }

                if (isNaN(age) || age <= 0) {
                    ageInput.focus();
                    ageInput.classList.add('ring-2', 'ring-red-400');
                    setTimeout(() => ageInput.classList.remove('ring-2', 'ring-red-400'), 2000);
                    return;
                }

                // Call greeting logic function
                const result = generateGreeting(name, age);

                // Dynamic UI update
                greetingText.textContent = result.message;
                
                if (result.isAdult) {
                    categoryBadge.textContent = 'Adult';
                    categoryBadge.className = 'text-[10px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded-full bg-pink-200 text-pink-800';
                    statusIcon.innerHTML = '<i class="fa-solid fa-user-check"></i>';
                    statusIcon.className = 'w-10 h-10 rounded-full bg-pink-600 text-white flex items-center justify-center flex-shrink-0 text-base shadow-sm mt-0.5';
                } else {
                    categoryBadge.textContent = 'Minor';
                    categoryBadge.className = 'text-[10px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded-full bg-pink-100 text-pink-700 border border-pink-300';
                    statusIcon.innerHTML = '<i class="fa-solid fa-child font-bold"></i>';
                    statusIcon.className = 'w-10 h-10 rounded-full bg-pink-400 text-white flex items-center justify-center flex-shrink-0 text-base shadow-sm mt-0.5';
                }

                // Show result with animation
                resultCard.classList.remove('hidden');
                resultCard.classList.remove('animate-fade-in');
                // Trigger reflow to restart animation
                void resultCard.offsetWidth;
                resultCard.classList.add('animate-fade-in');
            });

            // Enter key shortcut support
            [nameInput, ageInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        generateBtn.click();
                    }
                });
            });
        });
    </script>
</body>
</html>
